<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src https://dbuoperations.github.io; base-uri 'none'; form-action 'none'">
  <title>Caboledo Quest – Live-Spiel</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; min-height: 260px; background: #0a0d1c; color: #fff; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; min-height: 46px;
      padding: 6px 10px; border-bottom: 1px solid #344063; background: #17122f; }
    .brand { font-weight: 800; color: #ffdf00; letter-spacing: .035em; font-size: 12px; }
    .status { font-size: 11px; color: #c5c2df; flex: 1 1 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button, a { border: 1px solid #72549d; border-radius: 7px; background: #332350; color: #fff;
      padding: 6px 10px; font: 700 12px/1.2 Inter, system-ui, Arial, sans-serif; text-decoration: none; cursor: pointer; }
    button:hover, a:hover { background: #4b316f; }
    button:focus-visible, a:focus-visible { outline: 2px solid #ffdf00; outline-offset: 2px; }
    iframe { display: block; flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: #070b1b; }
    .error { padding: 20px; color: #ffc8cd; }
  </style>
</head>
<body>
  <header>
    <span class="brand" id="title">CABOLEDO QUEST</span>
    <span class="status" id="status" role="status" aria-live="polite">Spiel wird geladen …</span>
    <button id="reload" type="button" title="Neueste veröffentlichte Spielversion laden">↻ Aktualisieren</button>
    <a id="open" target="_blank" rel="noopener noreferrer" title="Spiel in neuem Tab öffnen">↗ Öffnen</a>
  </header>
  <iframe id="game" title="Interaktives Caboledo Quest Spiel" sandbox="allow-scripts allow-forms allow-pointer-lock" allow="fullscreen"></iframe>
  <script>
    (() => {
      'use strict';
      const params = new URLSearchParams(window.location.search);
      const rawSlot = params.get('slot') || '01';
      const valid = /^(0?[1-9]|1\d|20)$/.test(rawSlot);
      const slot = valid ? String(Number(rawSlot)).padStart(2, '0') : null;
      const game = document.getElementById('game');
      const status = document.getElementById('status');
      const button = document.getElementById('reload');
      const open = document.getElementById('open');
      if (!slot) {
        status.textContent = 'Ungültiger Slot: Erlaubt sind 01–20.';
        button.disabled = true;
        open.removeAttribute('href');
        return;
      }
      document.getElementById('title').textContent = `CABOLEDO QUEST · ${slot}`;
      document.title = `Caboledo Quest ${slot} – Live-Spiel`;
      let generation = 0;
      let timeout;
      function loadLatest() {
        // New query value per navigation defeats URL-based browser/CDN caches.
        const url = `game-${slot}.html?v=${Date.now()}-${++generation}`;
        status.textContent = 'Aktuelle Version wird geladen …';
        button.disabled = true;
        open.href = url;
        clearTimeout(timeout);
        timeout = setTimeout(() => {
          status.textContent = 'Laden dauert länger. Prüfe GitHub Pages oder öffne das Spiel direkt.';
          button.disabled = false;
        }, 20000);
        game.src = url;
      }
      game.addEventListener('load', () => {
        clearTimeout(timeout);
        status.textContent = 'Geladen · Bei neuer Veröffentlichung aktualisieren';
        button.disabled = false;
      });
      button.addEventListener('click', loadLatest);
      loadLatest();
    })();
  </script>
</body>
</html>
