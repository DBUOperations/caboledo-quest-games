<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src https://dbuoperations.github.io; base-uri 'none'; form-action 'none'">
  <title>Caboledo Quest – Live-Spiel</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, Arial, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; min-height: 0; background: #090b18; color: #fff; }
    header { display: flex; align-items: center; gap: 5px; flex: 0 0 31px; min-width: 0;
      padding: 3px 7px; border-bottom: 1px solid #393253; background: #17122a; }
    .brand { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      color: #ffdf00; font-size: 10px; font-weight: 800; letter-spacing: .035em; }
    .status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; white-space: nowrap; clip-path: inset(50%); border: 0; }
    .status.error { position: fixed; z-index: 3; left: 8px; bottom: 8px; width: auto; height: auto;
      margin: 0; padding: 8px 12px; max-width: calc(100% - 16px); white-space: normal; clip-path: none;
      font-size: 12px; color: #fff; background: #8f2642; border-radius: 7px; }
    button, a { flex: 0 0 auto; padding: 5px 8px; border: 1px solid #524172; border-radius: 6px;
      background: #2a2142; color: #fff; font: 700 11px/1 Inter,system-ui,Arial,sans-serif;
      text-decoration: none; cursor: pointer; }
    button:hover, a:hover { background: #453263; }
    button:focus-visible, a:focus-visible { outline: 2px solid #ffdf00; outline-offset: 1px; }
    button:disabled { opacity: .6; cursor: wait; }
    iframe { display: block; flex: 1 1 auto; width: 100%; height: 0; min-height: 0;
      margin: 0; border: 0; background: #070b1b; }
    @media (max-width: 440px) { header { padding: 3px 4px; } .brand { font-size: 9px; } button { padding: 5px 6px; } }
  </style>
</head>
<body>
  <header>
    <span class="brand" id="title">CABOLEDO QUEST</span>
    <span class="status" id="status" role="status" aria-live="polite">Spiel wird geladen …</span>
    <button id="reload" type="button" title="Neueste veröffentlichte Spielversion laden">↻ Aktualisieren</button>
    <a id="open" target="_blank" rel="noopener noreferrer" title="Spiel in neuem Tab öffnen" aria-label="Spiel in neuem Tab öffnen">↗</a>
  </header>
  <iframe id="game" title="Interaktives Caboledo Quest Spiel" sandbox="allow-scripts allow-forms allow-pointer-lock" allow="fullscreen"></iframe>
  <script>
    (() => {
      'use strict';
      const params = new URLSearchParams(window.location.search);
      const rawSlot = params.get('slot') || '01';
      const valid = /^(0?[1-9]|1\d|20)$/.test(rawSlot);
      const slot = valid ? String(Number(rawSlot)).padStart(2, '0') : null;
      const game = document.getElementById('game');
      const status = document.getElementById('status');
      const reload = document.getElementById('reload');
      const open = document.getElementById('open');
      if (!slot) {
        status.textContent = 'Ungültiger Slot: Erlaubt sind 01–20.';
        status.classList.add('error');
        reload.disabled = true;
        open.removeAttribute('href');
        return;
      }
      document.getElementById('title').textContent = `CABOLEDO · ${slot}`;
      document.title = `Caboledo Quest ${slot} – Live-Spiel`;
      let generation = 0;
      let timeout;
      function loadLatest() {
        const url = `game-${slot}.html?v=${Date.now()}-${++generation}`;
        status.textContent = 'Aktuelle Version wird geladen …';
        status.classList.remove('error');
        reload.disabled = true;
        open.href = url;
        clearTimeout(timeout);
        timeout = setTimeout(() => {
          status.textContent = 'Laden dauert länger. Prüfe GitHub Pages oder öffne das Spiel direkt.';
          status.classList.add('error');
          reload.disabled = false;
        }, 20000);
        game.src = url;
      }
      game.addEventListener('load', () => {
        clearTimeout(timeout);
        status.textContent = 'Geladen · Bei neuer Veröffentlichung aktualisieren';
        status.classList.remove('error');
        reload.disabled = false;
      });
      reload.addEventListener('click', loadLatest);
      loadLatest();
    })();
  </script>
</body>
</html>
