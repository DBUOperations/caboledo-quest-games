<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src https://dbuoperations.github.io; base-uri 'none'; form-action 'none'">
  <title>Caboledo Quest – Live-Spiel</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #090b18; }
    #game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #error { display: none; padding: 16px; color: white; font: 14px Arial, sans-serif; }
  </style>
</head>
<body>
  <iframe id="game" title="Caboledo Quest Spiel" sandbox="allow-scripts allow-forms allow-pointer-lock" allow="fullscreen"></iframe>
  <div id="error" role="alert"></div>
  <script>
    (() => {
      'use strict';
      const raw = new URLSearchParams(location.search).get('slot') || '01';
      if (!/^(0?[1-9]|1\d|20)$/.test(raw)) {
        document.getElementById('game').remove();
        const error = document.getElementById('error');
        error.style.display = 'block';
        error.textContent = 'Ungültiger Slot. Bitte 01–20 wählen.';
        return;
      }
      const slot = String(Number(raw)).padStart(2, '0');
      document.title = `Caboledo Quest ${slot}`;
      // Miro's own Refresh reloads this page, generating a new cache-busting URL.
      document.getElementById('game').src = `game-${slot}.html?v=${Date.now()}`;
    })();
  </script>
</body>
</html>
