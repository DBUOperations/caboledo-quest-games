<!doctype html>
<html lang="de">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lern-Snake</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:13px system-ui,sans-serif;background:#f3f5f7;color:#182b38}button,input,select,textarea{font:inherit;color:inherit}button,select,input,textarea{border:1px solid #aebbc5;border-radius:5px;background:white;min-width:0}button{cursor:pointer;padding:5px 10px}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #08756b;outline-offset:1px}
.app{width:100%;height:100dvh;padding:8px;display:flex;flex-direction:column;gap:7px;min-height:0;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}h1{font-size:18px;margin:0}#score{font-weight:600;font-variant-numeric:tabular-nums;font-size:12px}
.settings{display:grid;grid-template-columns:1.15fr 1.1fr .7fr .85fr 1fr auto;gap:6px;align-items:end;flex:none}
label{display:flex;flex-direction:column;gap:2px;font-size:11px;min-width:0}select,input{height:28px;padding:3px 5px;width:100%}.settings button{height:28px;background:#08756b;color:white;border-color:#08756b}
main{display:grid;grid-template-columns:minmax(0,1fr) 196px;gap:8px;flex:1;min-height:0;min-width:0}
.game{display:grid;grid-template-rows:32px minmax(0,1fr) 37px 28px;gap:4px;min-height:0;min-width:0}
#question{margin:0;font-size:13px;line-height:16px;display:flex;align-items:center;font-weight:650}
.field{min-height:0;min-width:0;background:#162c37;border-radius:5px;overflow:hidden}canvas{display:block;width:100%;height:100%}
#feedback{font-size:12px;line-height:17px;margin:0;overflow:hidden}.steer{display:flex;align-items:center;justify-content:center;gap:6px}.steer button{padding:0;width:40px;height:28px;font-size:18px;touch-action:none}.steer span{font-size:10px;color:#526571;margin-left:4px}
aside{display:flex;flex-direction:column;gap:7px;min-width:0;min-height:0;padding:8px;background:#fff;border:1px solid #d4dde3;border-radius:5px}
.progress{font-size:11px;line-height:16px}.progress strong{font-size:12px}.small{font-size:10px;color:#536773;line-height:14px}.lists{margin-top:3px;font-size:10px;line-height:14px;overflow-wrap:anywhere}
.notes{display:flex;flex-direction:column;gap:6px;min-height:0}textarea{resize:none;width:100%;height:37px;min-height:32px;padding:4px 5px}#action{font-size:12px}
.done{display:flex;flex-direction:row;align-items:center;gap:5px;font-size:11px}.done input{width:15px;height:15px;margin:0;flex:none}#task{font-size:11px;line-height:15px}
@media(max-width:520px){
.app{padding:6px;gap:5px}.settings{grid-template-columns:1fr 1fr 1fr;gap:4px}.settings label{font-size:10px}.settings button{width:100%}main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:5px}aside{display:grid;grid-template-columns:.95fr 1.2fr;gap:7px;padding:6px}.notes{gap:3px}.progress{line-height:14px}.lists{font-size:9px;line-height:12px}textarea{height:32px}#action{height:25px}.game{grid-template-rows:32px minmax(0,1fr) 35px 26px;gap:3px}.steer button{height:26px}.small{font-size:9px;line-height:12px}
}
@media(max-height:390px) and (min-width:521px){.app{padding:6px;gap:4px}aside{gap:4px;padding:6px}.notes{gap:4px}.game{grid-template-rows:29px minmax(0,1fr) 34px 26px;gap:3px}.steer button{height:26px}h1{font-size:16px}.lists{line-height:12px}textarea{height:32px}}
</style>
</head>
<body>
<div class="app">
<header><h1>Lern-Snake</h1><div id="score">Punkte: 0 · 0:30</div></header>
<div class="settings">
<label>Workshop<select id="workshop"><option value="kommunikation">Kommunikation</option><option value="teamarbeit">Teamarbeit</option></select></label>
<label>Thema<select id="topic"></select></label>
<label>Rundendauer<select id="duration"><option value="30">30 Sek.</option><option value="60">1 Min.</option><option value="120">2 Min.</option></select></label>
<label>Tempo<select id="speed"><option value="240">Langsam</option><option value="160" selected>Mittel</option><option value="100">Schnell</option></select></label>
<label>Üben<select id="mode"><option value="all">Alle Inhalte</option><option value="unsure">Nur unsichere</option></select></label>
<button id="start">Start</button>
</div>
<main>
<section class="game" aria-label="Snake-Lernspiel">
<p id="question"></p>
<div class="field"><canvas id="board" aria-label="Snake mit drei essbaren Antwortfeldern. Steuerung mit Pfeiltasten oder Pfeilknöpfen."></canvas></div>
<p id="feedback" role="status" aria-live="polite"></p>
<div class="steer" aria-label="Steuerung">
<button type="button" data-dir="left" aria-label="Links">←</button>
<button type="button" data-dir="up" aria-label="Oben">↑</button>
<button type="button" data-dir="down" aria-label="Unten">↓</button>
<button type="button" data-dir="right" aria-label="Rechts">→</button>
<span>Pfeiltasten / Tippen</span>
</div>
</section>
<aside>
<div class="progress">
<strong>Lernfortschritt</strong>
<div id="counts"></div>
<div class="small">Sicher: richtig in zwei verschiedenen Runden.</div>
<div id="lists" class="lists"></div>
<div id="saved" class="small"></div>
</div>
<div class="notes">
<label>Meine Erkenntnis<textarea id="insight" maxlength="240" placeholder="Das nehme ich mit …"></textarea></label>
<label>Maßnahme im Arbeitsalltag<input id="action" maxlength="120" placeholder="Was tue ich bis wann?"></label>
<label class="done"><input type="checkbox" id="done">Maßnahme erledigt</label>
<div id="task"></div>
</div>
</aside>
</main>
</div>
<script>
const catalog={
kommunikation:{name:"Kommunikation",topics:{
feedback:{name:"Feedback",questions:[
{id:"f1",tag:"Beobachtung",q:"Womit beginnt hilfreiches Feedback?",a:["Beobachtung","Vorwurf","Ratschlag"],c:0,e:"Beschreibe zuerst konkret, was du beobachtet hast."},
{id:"f2",tag:"Ich-Botschaft",q:"Welche Formulierung ist eine Ich-Botschaft?",a:["Du störst!","Ich bin irritiert","Du bist unfair"],c:1,e:"Ich-Botschaften benennen das eigene Erleben statt zu urteilen."},
{id:"f3",tag:"Bitte",q:"Wie wird aus Feedback ein nächster Schritt?",a:["Druck machen","Schweigen","Konkrete Bitte"],c:2,e:"Eine konkrete Bitte macht die gewünschte Veränderung umsetzbar."}
]},
zuhoeren:{name:"Zuhören",questions:[
{id:"z1",tag:"Paraphrase",q:"Was bedeutet Paraphrasieren?",a:["Widersprechen","Zusammenfassen","Unterbrechen"],c:1,e:"Gib das Gehörte in eigenen Worten wieder."},
{id:"z2",tag:"Offene Frage",q:"Welche Frage lädt zum Erzählen ein?",a:["Alles klar?","War es gut?","Was war wichtig?"],c:2,e:"Offene Fragen lassen Raum für eine ausführliche Antwort."},
{id:"z3",tag:"Verstehen",q:"Was hilft, Missverständnisse zu klären?",a:["Nachfragen","Vermuten","Thema wechseln"],c:0,e:"Prüfe dein Verständnis durch gezieltes Nachfragen."}
]}
}},
teamarbeit:{name:"Teamarbeit",topics:{
prioritaeten:{name:"Prioritäten",questions:[
{id:"p1",tag:"Wichtig",q:"Eine wichtige, nicht dringende Aufgabe sollte man …",a:["Ignorieren","Einplanen","Sofort stoppen"],c:1,e:"Plane wichtige Aufgaben ein, bevor sie dringend werden."},
{id:"p2",tag:"Fokus",q:"Was unterstützt konzentrierte Arbeit?",a:["Multitasking","Ständig chatten","Fokuszeit"],c:2,e:"Geschützte Fokuszeit reduziert Unterbrechungen."},
{id:"p3",tag:"Nächster Schritt",q:"Wie wird eine große Aufgabe handhabbar?",a:["Kleiner Schritt","Mehr abwarten","Alles zugleich"],c:0,e:"Definiere einen kleinen, konkret ausführbaren nächsten Schritt."}
]},
zusammenarbeit:{name:"Zusammenarbeit",questions:[
{id:"t1",tag:"Verantwortung",q:"Was braucht eine verlässlich verteilte Aufgabe?",a:["Viele Kopien","Klare Zuständigkeit","Nur eine Idee"],c:1,e:"Eine klar benannte Person übernimmt die Verantwortung."},
{id:"t2",tag:"Retrospektive",q:"Wozu dient eine Retrospektive?",a:["Schuld suchen","Status vorlesen","Verbessern"],c:2,e:"Das Team reflektiert die Zusammenarbeit und vereinbart Verbesserungen."},
{id:"t3",tag:"Fertig",q:"Was hilft beim gemeinsamen Verständnis von „fertig“?",a:["Klare Kriterien","Ein gutes Gefühl","Zeitdruck"],c:0,e:"Gemeinsame Fertig-Kriterien machen Ergebnisse überprüfbar."}
]}
}}
};
const $=id=>document.getElementById(id);
const ws=$("workshop"),topic=$("topic"),duration=$("duration"),speed=$("speed"),mode=$("mode"),start=$("start");
const canvas=$("board"),ctx=canvas.getContext("2d");
const key="lernsnake-frame-b-v1";
let store={learn:{},notes:{}},persistent=true;
try{const data=JSON.parse(localStorage.getItem(key));if(data&&data.learn&&data.notes)store=data;}catch(e){persistent=false;}
let active=false,phase="idle",roundId=0,points=0,length=3,snake=[],dir={x:1,y:0},nextDir={x:1,y:0};
let queue=[],current=null,remaining=30,endsAt=0,holdUntil=0,accumulator=0,lastTime=0;
let width=1,height=1,unit=1,offsetX=0,offsetY=0,highlight=-1;
const cols=24,rows=12;
const pads=[{x:1,y:2,w:7,h:3},{x:9,y:2,w:7,h:3},{x:17,y:2,w:6,h:3}];
const vectors={left:{x:-1,y:0},right:{x:1,y:0},up:{x:0,y:-1},down:{x:0,y:1}};
function questions(){return catalog[ws.value].topics[topic.value].questions;}
function noteKey(){return ws.value+"/"+topic.value;}
function record(q){return store.learn[q.id]||{level:0,last:0};}
function save(){try{localStorage.setItem(key,JSON.stringify(store));persistent=true;}catch(e){persistent=false;}$("saved").textContent=persistent?"Automatisch lokal gespeichert":"Speicherung nur in dieser Sitzung";}
function refreshProgress(){
const qs=questions(),right=qs.filter(q=>record(q).level>0),secure=qs.filter(q=>record(q).level>=2),practice=qs.filter(q=>record(q).level<2);
$("counts").textContent=`Richtig: ${right.length}/${qs.length} · Sicher: ${secure.length}/${qs.length}`;
$("lists").replaceChildren();
for(const [label,items] of [["Richtig",right],["Weiter üben",practice]]){
const line=document.createElement("div");line.textContent=label+": "+(items.map(q=>q.tag).join(", ")||"–");$("lists").append(line);
}
}
function loadNotes(){
const n=store.notes[noteKey()]||{};
$("insight").value=n.insight||"";$("action").value=n.action||"";$("done").checked=!!n.done;updateTask();
}
function updateTask(){
const exists=$("action").value.trim().length>0;
$("done").disabled=!exists;
if(!exists)$("done").checked=false;
$("task").textContent=`Dashboard: ${exists&&$("done").checked?1:0}/${exists?1:0} Aufgaben erledigt`+($("insight").value.trim()?" · Erkenntnis notiert":"");
}
function saveNotes(changedAction){
if(changedAction)$("done").checked=false;
updateTask();
store.notes[noteKey()]={insight:$("insight").value,action:$("action").value,done:$("done").checked};save();
}
$("insight").addEventListener("input",()=>saveNotes(false));
$("action").addEventListener("input",()=>saveNotes(true));
$("done").addEventListener("change",()=>saveNotes(false));
function resetSnake(){
snake=Array.from({length},(_,i)=>({x:12-i,y:10}));
dir={x:1,y:0};nextDir={x:1,y:0};accumulator=0;
}
function eligible(){return questions().filter(q=>mode.value==="all"||record(q).level<2);}
function showQuestion(){ $("question").textContent=current?current.q:"Alle Inhalte sicher – wähle „Alle Inhalte“ zum Wiederholen."; }
function preview(){
current=eligible()[0]||null;points=0;length=3;remaining=+duration.value;highlight=-1;resetSnake();showQuestion();updateScore();
$("feedback").textContent=current?"Friss das richtige Antwortfeld. Kollisionen löschen keinen Lernfortschritt.":"Im gewählten Thema sind keine unsicheren Fragen mehr offen.";
}
function updateTopic(){
topic.replaceChildren();
for(const [id,t] of Object.entries(catalog[ws.value].topics)){const o=document.createElement("option");o.value=id;o.textContent=t.name;topic.append(o);}
changeSelection();
}
function changeSelection(){loadNotes();refreshProgress();preview();}
ws.addEventListener("change",updateTopic);
topic.addEventListener("change",changeSelection);
mode.addEventListener("change",preview);
duration.addEventListener("change",()=>{remaining=+duration.value;updateScore();});
function updateScore(){
const secs=Math.max(0,Math.ceil(remaining));
$("score").textContent=`Punkte: ${points} · ${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}`;
}
function lockSettings(locked){[ws,topic,duration,speed,mode].forEach(el=>el.disabled=locked);}
function begin(){
queue=eligible().slice().sort((a,b)=>record(a).level-record(b).level);
if(!queue.length){$("feedback").textContent="Keine unsicheren Fragen offen. Wähle „Alle Inhalte“.";return;}
active=true;phase="play";roundId=Date.now();points=0;length=3;remaining=+duration.value;endsAt=performance.now()+remaining*1000;
lockSettings(true);start.textContent="Beenden";nextQuestion();
$("feedback").textContent="Lenke die Schlange in das richtige Antwortfeld.";updateScore();
}
function finish(message){
active=false;phase="idle";accumulator=0;lockSettings(false);start.textContent="Wiederholen";
$("feedback").textContent=message||"Runde beendet. Lernstand bleibt gespeichert – starte später eine Wiederholung.";
refreshProgress();save();updateScore();
}
start.addEventListener("click",()=>active?finish():begin());
function nextQuestion(){
if(mode.value==="unsure")queue=queue.filter(q=>record(q).level<2);
if(!queue.length){finish("Alle Inhalte sicher! Wähle „Alle Inhalte“, um weiter zu üben.");return;}
current=queue.shift();highlight=-1;phase="play";resetSnake();showQuestion();
}
function answer(index,now){
const correct=index===current.c,r=record(current);
if(correct){points+=10;length=Math.min(8,length+1);store.learn[current.id]={level:Math.min(2,r.level+(r.last!==roundId?1:0)),last:roundId};}
else store.learn[current.id]={level:0,last:0};
queue.push(current);
highlight=index;phase="answer";holdUntil=now+2700;accumulator=0;
if(correct){const tail=snake[snake.length-1];snake.push({x:tail.x,y:tail.y});}
$("feedback").textContent=(correct?"Richtig! ":"Falsch. ")+"Lösung: "+current.a[current.c]+". "+current.e;
refreshProgress();save();updateScore();
}
function turn(name){
if(!active||phase!=="play")return;
const v=vectors[name];if(v&&(v.x!==-dir.x||v.y!==-dir.y))nextDir={...v};
}
document.addEventListener("keydown",e=>{
if(/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName))return;
const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};
if(map[e.key]){e.preventDefault();turn(map[e.key]);}
});
document.querySelectorAll("[data-dir]").forEach(b=>{
b.addEventListener("pointerdown",e=>{e.preventDefault();turn(b.dataset.dir);});
b.addEventListener("click",e=>{if(e.detail===0)turn(b.dataset.dir);});
});
start.addEventListener("click",()=>start.blur());
function step(now){
dir={...nextDir};
const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
const hit=snake.slice(0,-1).some(p=>p.x===head.x&&p.y===head.y);
if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||hit){
resetSnake();phase="collision";holdUntil=now+850;
$("feedback").textContent="Kollision – neuer Versuch. Punkte und Lernfortschritt bleiben erhalten.";return;
}
snake.unshift(head);snake.pop();
const index=pads.findIndex(p=>head.x>=p.x&&head.x<p.x+p.w&&head.y>=p.y&&head.y<p.y+p.h);
if(index>=0)answer(index,now);
}
function resize(){
const r=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
width=Math.max(1,r.width);height=Math.max(1,r.height);
canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);
unit=Math.min(width/cols,height/rows);offsetX=(width-cols*unit)/2;offsetY=(height-rows*unit)/2;
draw();
}
function wrap(text,maxWidth){
const result=[];let line="";
for(const word of text.split(" ")){
if(line&&ctx.measureText(line+" "+word).width>maxWidth){result.push(line);line=word;}
else line+=(line?" ":"")+word;
}
if(line)result.push(line);
return result;
}
function draw(){
ctx.fillStyle="#162c37";ctx.fillRect(0,0,width,height);
ctx.strokeStyle="#45616d";ctx.lineWidth=1;ctx.strokeRect(offsetX+.5,offsetY+.5,cols*unit-1,rows*unit-1);
if(current){
pads.forEach((p,i)=>{
const x=offsetX+p.x*unit,y=offsetY+p.y*unit,w=p.w*unit,h=p.h*unit;
ctx.fillStyle=highlight<0?"#e7eef1":i===current.c?"#abebc8":i===highlight?"#ffc1b8":"#e7eef1";
ctx.fillRect(x+1,y+1,w-2,h-2);
ctx.fillStyle="#132f3e";let font=Math.min(13,unit*.88);ctx.font="600 "+font+"px system-ui";
const text=current.a[i];
while(text.split(" ").some(s=>ctx.measureText(s).width>w-8)&&font>6){font-=.5;ctx.font="600 "+font+"px system-ui";}
const lines=wrap(text,w-8);const lh=font+2;
ctx.textAlign="center";ctx.textBaseline="middle";
lines.forEach((line,j)=>ctx.fillText(line,x+w/2,y+h/2+(j-(lines.length-1)/2)*lh));
});
}
snake.forEach((p,i)=>{
ctx.fillStyle=i===0?"#fff0a0":"#62d6be";
ctx.fillRect(offsetX+p.x*unit+1,offsetY+p.y*unit+1,Math.max(1,unit-2),Math.max(1,unit-2));
});
if(!active){
ctx.font="600 "+Math.max(10,Math.min(14,unit))+"px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#fff";
ctx.fillText("Mit „"+start.textContent+"“ spielen",width/2,offsetY+7.5*unit);
}
}
function frame(now){
const dt=lastTime?Math.min(250,now-lastTime):0;lastTime=now;
if(active){
remaining=Math.max(0,(endsAt-now)/1000);updateScore();
if(remaining<=0){
const lastAnswer=phase==="answer"?$("feedback").textContent+" Runde beendet.":"Runde beendet. Lernstand gespeichert – später erneut üben.";
finish(lastAnswer);
}else if(phase==="answer"||phase==="collision"){
if(now>=holdUntil){if(phase==="answer")nextQuestion();else{phase="play";accumulator=0;}}
}else if(phase==="play"){
accumulator+=dt;const tick=+speed.value;
while(accumulator>=tick&&active&&phase==="play"){accumulator-=tick;step(now);}
}
}
draw();requestAnimationFrame(frame);
}
updateTopic();save();
new ResizeObserver(resize).observe(canvas.parentElement);
window.addEventListener("resize",resize);
resize();requestAnimationFrame(frame);
</script>
</body>
</html>
