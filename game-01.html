<!doctype html>
<html lang="de">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bildungsurlaub-Pong</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#10151d;color:#edf5ef;font-family:ui-monospace,Consolas,monospace}
main{width:100%;height:100dvh;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
h1{font-size:clamp(15px,2.6vw,22px);margin:0;color:#83edb3}
button{font:inherit;font-size:13px;background:#83edb3;color:#10151d;border:0;border-radius:3px;padding:9px 12px;cursor:pointer;flex-shrink:0}
button:hover{background:#b0ffd2}
button:focus-visible,canvas:focus-visible{outline:2px solid #ffc573;outline-offset:2px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;flex-shrink:0}
.side{display:flex;align-items:center;gap:10px;font-size:12px;color:#83edb3;min-width:0}
.side:last-child{justify-content:flex-end;text-align:right;color:#ffc573}
.side span{line-height:1.4}
.side strong{font-size:28px;line-height:1}
.goal{font-size:11px;color:#9ba9b6;text-align:center}
.field{position:relative;flex:1;min-height:0;min-width:0;border:1px solid #394657;background:#121b25}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;font-size:11px;line-height:1.4}
#status{color:#ffc573}
.hint{color:#9ba9b6;text-align:right}
@media(max-width:440px){main{padding:9px;gap:8px}.side{font-size:10px;gap:7px}.side strong{font-size:25px}.goal{font-size:10px}footer{align-items:flex-start;gap:8px}.hint{max-width:130px}button{padding:8px;font-size:11px}}
@media(max-height:380px){main{padding:8px;gap:6px}h1{font-size:16px}.side strong{font-size:24px}button{padding:7px 10px}.side span{line-height:1.2}}
</style>
</head>
<body>
<main>
<header>
<h1>Bildungsurlaub-Pong</h1>
<button id="restart" type="button">Neustart</button>
</header>
<div class="scoreboard" aria-label="Punktestand">
<div class="side"><span>DU<br>Lernzeit</span><strong id="you">0</strong></div>
<div class="goal">Zuerst 7 Punkte</div>
<div class="side"><strong id="computer">0</strong><span>COMPUTER<br>Büroalltag</span></div>
</div>
<div class="field">
<canvas id="court" tabindex="0" aria-label="Pong-Spielfeld. Linken Schläger mit Maus, Touch oder Pfeiltasten bewegen."></canvas>
</div>
<footer>
<span id="status" role="status" aria-live="polite">Bereit für deine Lernzeit?</span>
<span class="hint">Maus / Touch · ↑ ↓</span>
</footer>
</main>
<script>
(() => {
'use strict';
const canvas = document.getElementById('court');
const ctx = canvas.getContext('2d');
const scoreYou = document.getElementById('you');
const scoreComputer = document.getElementById('computer');
const status = document.getElementById('status');
let W = 0, H = 0, paddleH = 60, paddleW = 10, inset = 16, radius = 5, base = 300;
let leftY = 0, rightY = 0, target = 0;
let x = 0, y = 0, vx = 0, vy = 0;
let you = 0, computer = 0, finished = false, wait = .8, serveDirection = 1;
let aiOffset = 0, aiTimer = 0;
const keys = {up:false, down:false};
const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
const limitY = value => clamp(value, paddleH / 2, H - paddleH / 2);

function resize() {
  const rect = canvas.getBoundingClientRect();
  const oldW = W || rect.width, oldH = H || rect.height;
  W = Math.max(1, rect.width);
  H = Math.max(1, rect.height);
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * ratio);
  canvas.height = Math.round(H * ratio);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  const oldBase = base;
  base = clamp(W * .47, 190, 390);
  paddleH = Math.min(H * .25, clamp(H * .22, 42, 88));
  paddleW = W < 420 ? 8 : 11;
  inset = W < 420 ? 12 : 20;
  radius = W < 420 ? 4 : 5;
  x = clamp(x * W / oldW, radius, W - radius);
  y = clamp(y * H / oldH, radius, H - radius);
  leftY = limitY(leftY * H / oldH);
  rightY = limitY(rightY * H / oldH);
  target = limitY(target * H / oldH);
  vx *= base / oldBase;
  vy *= base / oldBase;
  if (wait > 0) { x = W / 2; y = H / 2; }
}

function reset() {
  you = 0;
  computer = 0;
  scoreYou.textContent = '0';
  scoreComputer.textContent = '0';
  finished = false;
  keys.up = keys.down = false;
  leftY = rightY = target = H / 2;
  x = W / 2;
  y = H / 2;
  vx = vy = 0;
  wait = .85;
  serveDirection = Math.random() < .5 ? -1 : 1;
  aiTimer = 0;
  aiOffset = 0;
  status.textContent = 'Anstoß · Hol dir deine Lernzeit!';
}

function serve() {
  x = W / 2;
  y = H / 2;
  const angle = (Math.random() < .5 ? -1 : 1) * (.2 + Math.random() * .3);
  vx = serveDirection * base * Math.cos(angle);
  vy = base * Math.sin(angle);
  aiTimer = 0;
  status.textContent = 'Match läuft · Bis 7 Punkte';
}

function point(player) {
  if (player) {
    you++;
    scoreYou.textContent = String(you);
  } else {
    computer++;
    scoreComputer.textContent = String(computer);
  }
  vx = vy = 0;
  x = W / 2;
  y = H / 2;
  if (you === 7 || computer === 7) {
    finished = true;
    wait = 0;
    status.textContent = you === 7 ? 'Gewonnen! Zeit für Bildungsurlaub.' : 'Verloren · Noch ein Match?';
  } else {
    serveDirection = player ? 1 : -1;
    wait = .8;
    status.textContent = player ? 'Punkt für deine Lernzeit!' : 'Punkt für den Büroalltag.';
  }
}

function hit(left) {
  const center = left ? leftY : rightY;
  const offset = clamp((y - center) / (paddleH / 2), -1, 1);
  const angle = offset * 1.02;
  const speed = Math.min(Math.hypot(vx, vy) * 1.065, base * 2);
  vx = (left ? 1 : -1) * speed * Math.cos(angle);
  vy = speed * Math.sin(angle);
  x = left ? inset + paddleW + radius + .05 : W - inset - paddleW - radius - .05;
}

function update(dt) {
  if (finished) return;
  if (keys.up || keys.down) {
    leftY = limitY(leftY + ((keys.down ? 1 : 0) - (keys.up ? 1 : 0)) * Math.max(H * 1.35, base * 1.4) * dt);
    target = leftY;
  } else {
    const distance = target - leftY;
    const step = Math.max(H * 2.8, base * 2) * dt;
    leftY = limitY(leftY + clamp(distance, -step, step));
  }

  aiTimer -= dt;
  if (aiTimer <= 0) {
    aiTimer = .16;
    aiOffset = (Math.random() - .5) * paddleH * .65;
  }
  const aim = vx > 0 ? y + aiOffset : H / 2;
  const aiSpeed = Math.max(base * .76, H * .48);
  rightY = limitY(rightY + clamp(aim - rightY, -aiSpeed * dt, aiSpeed * dt));

  if (wait > 0) {
    wait -= dt;
    if (wait <= 0) serve();
    return;
  }

  x += vx * dt;
  y += vy * dt;
  if (y - radius <= 0 && vy < 0) {
    y = radius;
    vy = Math.abs(vy);
  } else if (y + radius >= H && vy > 0) {
    y = H - radius;
    vy = -Math.abs(vy);
  }

  const leftFace = inset + paddleW;
  const rightFace = W - inset - paddleW;
  if (vx < 0 && x - radius <= leftFace && x >= inset &&
      y + radius >= leftY - paddleH / 2 && y - radius <= leftY + paddleH / 2) {
    hit(true);
  } else if (vx > 0 && x + radius >= rightFace && x <= W - inset &&
      y + radius >= rightY - paddleH / 2 && y - radius <= rightY + paddleH / 2) {
    hit(false);
  }

  if (x + radius < 0) point(false);
  else if (x - radius > W) point(true);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#344251';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 9]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#83edb3';
  ctx.fillRect(inset, leftY - paddleH / 2, paddleW, paddleH);
  ctx.fillStyle = '#ffc573';
  ctx.fillRect(W - inset - paddleW, rightY - paddleH / 2, paddleW, paddleH);
  if (!finished) {
    ctx.fillStyle = '#f4f7ee';
    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
  } else {
    const size = clamp(W * .045, 16, 30);
    ctx.font = 'bold ' + size + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const title = you === 7 ? 'GEWONNEN!' : 'MATCH VERLOREN';
    const textWidth = ctx.measureText(title).width;
    ctx.fillStyle = '#121b25';
    ctx.fillRect(W / 2 - textWidth / 2 - 12, H / 2 - size, textWidth + 24, size * 2);
    ctx.fillStyle = you === 7 ? '#83edb3' : '#ffc573';
    ctx.fillText(title, W / 2, H / 2);
  }
}

function pointer(event) {
  const rect = canvas.getBoundingClientRect();
  target = limitY((event.clientY - rect.top) * H / rect.height);
}
canvas.addEventListener('pointerdown', event => {
  event.preventDefault();
  canvas.focus({preventScroll:true});
  canvas.setPointerCapture(event.pointerId);
  pointer(event);
});
canvas.addEventListener('pointermove', pointer);
window.addEventListener('keydown', event => {
  if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
    event.preventDefault();
    keys[event.key === 'ArrowUp' ? 'up' : 'down'] = true;
  }
});
window.addEventListener('keyup', event => {
  if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
    event.preventDefault();
    keys[event.key === 'ArrowUp' ? 'up' : 'down'] = false;
  }
});
window.addEventListener('blur', () => { keys.up = keys.down = false; });
document.getElementById('restart').addEventListener('click', reset);
window.addEventListener('resize', resize);
resize();
reset();
let last = 0;
function frame(now) {
  let remaining = last ? Math.min((now - last) / 1000, .04) : 0;
  last = now;
  while (remaining > 0) {
    const step = Math.min(remaining, 1 / 240);
    update(step);
    remaining -= step;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
