<!doctype html>
<html lang="de">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<title>Bildungsurlaub Pong</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{height:100%;margin:0;padding:0;}
body{box-sizing:border-box;min-width:0;min-height:0;width:100vw;height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#181e2a;}
#pong-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100dvh;min-width:0;min-height:0;}
#ui{display:flex;gap:12px;align-items:center;margin-bottom:8px;}
#score{font:700 1.2rem monospace;color:#fff;letter-spacing:2px;}
#diff{font:400 1rem sans-serif;}
button,select{font:inherit;padding:2px 8px;border-radius:4px;border:none;background:#2c3550;color:#fff;cursor:pointer;}
button:active{background:#3a4470;}
#canvas{background:#232b3a;border-radius:12px;box-shadow:0 0 16px #0006;display:block;touch-action:none;}
#overlay{position:absolute;top:0;left:0;width:100%;height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2;background:rgba(24,30,42,0.92);color:#fff;font-family:sans-serif;transition:opacity .2s;}
#overlay h2{font-size:2rem;margin:0 0 12px;}
#overlay button{margin-top:16px;}
@media (max-width:700px){
  #canvas{width:98vw !important;height:56vw !important;max-width:100vw;max-height:60dvh;}
}
</style>
</head>
<body>
<div id="pong-wrap">
  <div id="ui">
    <span id="score">0 : 0</span>
    <label id="diff">Schwierigkeit:
      <select id="difficulty">
        <option value="easy">Leicht</option>
        <option value="medium" selected>Mittel</option>
        <option value="hard">Schwer</option>
      </select>
    </label>
    <button id="pause">Pause</button>
    <button id="restart">Neustart</button>
  </div>
  <canvas id="canvas" width="640" height="360" tabindex="0"></canvas>
  <div id="overlay" style="display:none;">
    <h2 id="result"></h2>
    <button id="again">Nochmal spielen</button>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W=640,H=360;
function resize() {
  const rW = Math.min(window.innerWidth*0.98,900);
  const rH = Math.min(window.innerHeight*0.7,500);
  let scale = Math.min(rW/640, rH/360, 1);
  W = Math.round(640*scale); H = Math.round(360*scale);
  canvas.width=W; canvas.height=H;
}
resize();
window.addEventListener('resize',resize);

const paddleW = ()=>Math.round(W*0.018), paddleH = ()=>Math.round(H*0.18), ballR = ()=>Math.round(W*0.018);
const netW = ()=>Math.round(W*0.012), netH = ()=>Math.round(H*0.04);

let gameState, playerY, aiY, ball, ballSpeed, ballVel, playerScore, aiScore, paused, winner, diff, aiErr, aiSpeed, lastTouch, trail;
const maxScore=7;
const diffSettings = {
  easy:{aiErr:0.25,aiSpeed:0.09,ball:4.2},
  medium:{aiErr:0.13,aiSpeed:0.13,ball:5.2},
  hard:{aiErr:0.05,aiSpeed:0.19,ball:6.2}
};
function resetGame(initDiff) {
  diff = diffSettings[initDiff||document.getElementById('difficulty').value];
  playerY = H/2-paddleH()/2;
  aiY = H/2-paddleH()/2;
  playerScore = 0; aiScore = 0;
  ballSpeed = diff.ball;
  ball = {x:W/2,y:H/2};
  ballVel = {x:Math.random()<0.5?-1:1,y:(Math.random()-0.5)*1.2};
  paused = false; winner = null; lastTouch='player';
  trail = [];
  updateScore();
  document.getElementById('overlay').style.display='none';
}
function serve(dir) {
  ball.x=W/2; ball.y=H/2;
  let angle = (Math.random()-0.5)*0.9;
  ballVel.x = dir*(0.9+Math.random()*0.3);
  ballVel.y = angle;
  ballSpeed = diff.ball;
  lastTouch = dir<0?'ai':'player';
  trail = [];
}
function updateScore() {
  document.getElementById('score').textContent = playerScore+' : '+aiScore;
}
function drawNet() {
  ctx.save();
  ctx.fillStyle='#3a4470';
  for(let y=0;y<H;y+=netH()*2){
    ctx.fillRect(W/2-netW()/2,y,netW(),netH());
  }
  ctx.restore();
}
function drawPaddle(x,y) {
  ctx.save();
  ctx.fillStyle='#f7e06b';
  ctx.shadowColor='#ffe066';
  ctx.shadowBlur=8;
  ctx.fillRect(x,y,paddleW(),paddleH());
  ctx.restore();
}
function drawBall() {
  // Trail
  for(let i=trail.length-1;i>=0;i--){
    let t=trail[i],a=(i+1)/trail.length;
    ctx.save();
    ctx.globalAlpha=0.13*a;
    ctx.beginPath();
    ctx.arc(t.x,t.y,ballR()+i*1.2,0,2*Math.PI);
    ctx.fillStyle='#6be0f7';
    ctx.shadowColor='#6be0f7';
    ctx.shadowBlur=12*a;
    ctx.fill();
    ctx.restore();
  }
  // Ball
  ctx.save();
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ballR(),0,2*Math.PI);
  ctx.fillStyle='#6be0f7';
  ctx.shadowColor='#6be0f7';
  ctx.shadowBlur=18;
  ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.clearRect(0,0,W,H);
  drawNet();
  drawPaddle(0,playerY);
  drawPaddle(W-paddleW(),aiY);
  drawBall();
}
function clamp(val,min,max){return Math.max(min,Math.min(max,val));}
function playSound(type){
  try{
    let ctxA=new(window.AudioContext||window.webkitAudioContext)();
    let o=ctxA.createOscillator(),g=ctxA.createGain();
    o.type='square';
    if(type==='paddle'){o.frequency.value=420;}
    else if(type==='score'){o.frequency.value=220;}
    else{o.frequency.value=320;}
    g.gain.value=0.11;
    o.connect(g);g.connect(ctxA.destination);
    o.start();
    o.stop(ctxA.currentTime+0.09);
    setTimeout(()=>ctxA.close(),120);
  }catch(e){}
}
function step() {
  if(paused||winner) return;
  // AI movement
  let aiCenter = aiY+paddleH()/2;
  let target = ball.y + (Math.random()-0.5)*diff.aiErr*H;
  if(aiCenter<target-8) aiY+=aiSpeed*H;
  else if(aiCenter>target+8) aiY-=aiSpeed*H;
  aiY=clamp(aiY,0,H-paddleH());
  // Ball movement
  for(let sub=0;sub<2;sub++){ // Prevent tunneling
    ball.x+=ballVel.x*ballSpeed/2;
    ball.y+=ballVel.y*ballSpeed/2;
    // Wall bounce
    if(ball.y-ballR()<0){ball.y=ballR();ballVel.y=Math.abs(ballVel.y);playSound('wall');}
    if(ball.y+ballR()>H){ball.y=H-ballR();ballVel.y=-Math.abs(ballVel.y);playSound('wall');}
    // Paddle collision
    // Left (player)
    if(ball.x-ballR()<paddleW()+2){
      if(ball.y>playerY-2&&ball.y<playerY+paddleH()+2){
        ball.x=paddleW()+ballR()+2;
        let rel=(ball.y-(playerY+paddleH()/2))/(paddleH()/2);
        ballVel.x=Math.abs(ballVel.x);
        ballVel.y=rel*1.2;
        ballSpeed*=1.09;
        lastTouch='player';
        playSound('paddle');
      }
    }
    // Right (AI)
    if(ball.x+ballR()>W-paddleW()-2){
      if(ball.y>aiY-2&&ball.y<aiY+paddleH()+2){
        ball.x=W-paddleW()-ballR()-2;
        let rel=(ball.y-(aiY+paddleH()/2))/(paddleH()/2);
        ballVel.x=-Math.abs(ballVel.x);
        ballVel.y=rel*1.2;
        ballSpeed*=1.09;
        lastTouch='ai';
        playSound('paddle');
      }
    }
    // Score
    if(ball.x+ballR()<0){
      aiScore++;
      updateScore();
      playSound('score');
      if(aiScore>=maxScore){winner='ai';showOverlay();}
      else serve(1);
      return;
    }
    if(ball.x-ballR()>W){
      playerScore++;
      updateScore();
      playSound('score');
      if(playerScore>=maxScore){winner='player';showOverlay();}
      else serve(-1);
      return;
    }
  }
  // Trail
  trail.push({x:ball.x,y:ball.y});
  if(trail.length>16) trail.shift();
}
function loop() {
  if(!paused&&!winner) step();
  draw();
  requestAnimationFrame(loop);
}
function showOverlay(){
  const o=document.getElementById('overlay');
  o.style.display='flex';
  let r=document.getElementById('result');
  if(winner==='player') r.textContent='Gewonnen! Bildungsurlaub erreicht 🎉';
  else r.textContent='Verloren! Versuche es erneut.';
}
document.getElementById('again').onclick=()=>{resetGame();};
document.getElementById('restart').onclick=()=>{resetGame();};
document.getElementById('pause').onclick=()=>{
  if(winner) return;
  paused=!paused;
  document.getElementById('pause').textContent=paused?'Fortsetzen':'Pause';
};
document.getElementById('difficulty').onchange=()=>{
  resetGame(document.getElementById('difficulty').value);
};
canvas.addEventListener('pointerdown',e=>{
  let rect=canvas.getBoundingClientRect();
  let y=(e.clientY-rect.top)/rect.height*H;
  playerY=clamp(y-paddleH()/2,0,H-paddleH());
});
canvas.addEventListener('pointermove',e=>{
  if(e.buttons){
    let rect=canvas.getBoundingClientRect();
    let y=(e.clientY-rect.top)/rect.height*H;
    playerY=clamp(y-paddleH()/2,0,H-paddleH());
  }
});
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length){
    let rect=canvas.getBoundingClientRect();
    let y=(e.touches[0].clientY-rect.top)/rect.height*H;
    playerY=clamp(y-paddleH()/2,0,H-paddleH());
  }
});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length){
    let rect=canvas.getBoundingClientRect();
    let y=(e.touches[0].clientY-rect.top)/rect.height*H;
    playerY=clamp(y-paddleH()/2,0,H-paddleH());
  }
});
document.addEventListener('keydown',e=>{
  if(document.activeElement!==canvas&&document.activeElement!==document.body)return;
  if(e.key==='ArrowUp'||e.key==='w'){playerY=clamp(playerY-0.09*H,0,H-paddleH());}
  if(e.key==='ArrowDown'||e.key==='s'){playerY=clamp(playerY+0.09*H,0,H-paddleH());}
  if(e.key===' '){document.getElementById('pause').click();}
  if(e.key==='r'){resetGame();}
});
canvas.tabIndex=0;
canvas.style.outline='none';
canvas.addEventListener('focus',()=>{});
function init() {
  aiErr=diff.aiErr; aiSpeed=diff.aiSpeed;
  resetGame();
  loop();
}
init();
</script>
</body>
</html>
