<!doctype html>
<html lang="de">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake · Workshop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,sans-serif;background:#f1f5f3;color:#16362b}
.app{width:100%;height:100vh;height:100dvh;min-width:0;min-height:0;display:flex;flex-direction:column;gap:5px;padding:8px;max-width:1000px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;line-height:1.2;margin:0}
.keys{font-size:11px;color:#496357}
.stats{display:flex;gap:5px 15px;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums}
.stats b{font-weight:750}
.info{background:#fff;border:1px solid #d4dfd9;border-radius:5px;padding:5px 8px;flex:none}
#title{font-size:13px;font-weight:700;line-height:1.3}
#detail{font-size:12px;line-height:1.3;color:#496357;margin-top:2px}
.board{position:relative;flex:1;min-height:0;min-width:0;overflow:hidden;border:2px solid #527866;border-radius:4px;background:#122c23}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.answer{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;border:2px solid #86c6e7;border-radius:4px;background:#e6f4fd;color:#12364d;font-weight:700;font-size:clamp(11px,1.65vw,14px);line-height:1.2;overflow-wrap:break-word;pointer-events:none}
.answer[hidden]{display:none}
footer{display:flex;align-items:center;justify-content:space-between;gap:5px;flex:none}
.actions,.directions{display:flex;gap:4px}
button{border:1px solid #adc2b6;border-radius:5px;background:#fff;color:#16362b;font:600 12px system-ui;min-height:36px;padding:6px 11px;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid #388ec0;outline-offset:1px}
button:active:not(:disabled){background:#cfe7d8}
button:disabled{opacity:.45;cursor:default}
#main{background:#236447;color:#fff;border-color:#236447;min-width:67px}
.directions button{font-size:19px;width:38px;padding:2px}
@media(max-width:400px){
.app{padding:5px;gap:4px}
header{gap:3px}
h1{font-size:16px}
.keys{font-size:10px}
.stats{gap:3px 9px;font-size:11px}
button{padding:5px 8px;min-height:34px}
.directions button{width:32px}
#main{min-width:60px}
}
</style>
</head>
<body>
<main class="app">
<header>
<h1>Snake · Workshop</h1>
<span class="keys">Pfeile / WASD / Bildschirmtasten</span>
</header>
<div class="stats">
<span>Punkte: <b id="points">0</b></span>
<span>Highscore: <b id="high">0</b></span>
<span id="learning">Gelernt: 0/5</span>
<span>Münzen: <b id="coins">0/9</b></span>
</div>
<section class="info" aria-live="polite" aria-atomic="true">
<div id="title"></div>
<div id="detail"></div>
</section>
<div class="board" id="board">
<canvas id="canvas" role="img" aria-label="Snake-Spielfeld: Schlange, Münze und bei Fragen zwei essbare Antwortfelder"></canvas>
<div class="answer" id="answer0" hidden></div>
<div class="answer" id="answer1" hidden></div>
</div>
<footer>
<div class="actions">
<button id="main" type="button">Start</button>
<button id="restart" type="button">Neustart</button>
</div>
<div class="directions" role="group" aria-label="Schlange steuern">
<button type="button" data-dir="left" aria-label="Links">←</button>
<button type="button" data-dir="up" aria-label="Oben">↑</button>
<button type="button" data-dir="down" aria-label="Unten">↓</button>
<button type="button" data-dir="right" aria-label="Rechts">→</button>
</div>
</footer>
</main>
<script>
const QUESTIONS = [
  {
    id:"gamification",
    question:"Was bedeutet Gamification?",
    correct:"Spielelemente im Alltag einsetzen",
    wrong:"Jede Aufgabe zum Videospiel machen",
    explanation:"Gamification nutzt Spielelemente in spielfremden Zusammenhängen."
  },
  {
    id:"feedback",
    question:"Was ist unmittelbares Feedback?",
    correct:"Direkt eine Rückmeldung erhalten",
    wrong:"Erst am Kursende ein Ergebnis sehen",
    explanation:"Die Rückmeldung folgt direkt auf die Handlung."
  },
  {
    id:"autonomie",
    question:"Was bedeutet Autonomie beim Lernen?",
    correct:"Mitentscheiden können",
    wrong:"Keine Wahlmöglichkeiten haben",
    explanation:"Lernende können beispielsweise Thema oder Schwierigkeit wählen."
  },
  {
    id:"fortschritt",
    question:"Was zeigt eine Fortschrittsanzeige?",
    correct:"Den erreichten Stand",
    wrong:"Die Erklärung neuer Inhalte",
    explanation:"Sie zeigt, was geschafft wurde und was noch offen ist."
  },
  {
    id:"transfer",
    question:"Was bedeutet Transfer nach einem Workshop?",
    correct:"Gelerntes im Alltag anwenden",
    wrong:"Nur Spielpunkte sammeln",
    explanation:"Workshop-Inhalte werden auf konkrete Alltagssituationen übertragen."
  }
];
const $ = id => document.getElementById(id);
const board=$("board"), canvas=$("canvas"), ctx=canvas.getContext("2d");
const fields=[$("answer0"),$("answer1")];
const controls=[...document.querySelectorAll("[data-dir]")];
const COLS=20, ROWS=14, STORE="snake-workshop-v1";
const vectors={left:{x:-1,y:0},right:{x:1,y:0},up:{x:0,y:-1},down:{x:0,y:1}};
let high=0, learned=new Set(), persistent=true;
try{
  const data=JSON.parse(localStorage.getItem(STORE)||"{}");
  if(Number.isFinite(data.high)) high=Math.max(0,Math.floor(data.high));
  if(Array.isArray(data.learned)){
    learned=new Set(data.learned.filter(id=>QUESTIONS.some(q=>q.id===id)));
  }
  localStorage.setItem(STORE,JSON.stringify({high,learned:[...learned]}));
}catch(e){persistent=false}
let snake=[], direction=vectors.right, turns=[], coin=null, points=0, count=0;
let state="ready", active=null, queue=[], result=null, endText="";
let width=1,height=1,accumulator=0,lastTime=0;
function save(){
  high=Math.max(high,points);
  try{localStorage.setItem(STORE,JSON.stringify({high,learned:[...learned]}))}
  catch(e){persistent=false}
}
function hud(){
  $("points").textContent=points;
  $("high").textContent=high;
  $("coins").textContent=count+"/9";
  $("learning").textContent="Gelernt: "+learned.size+"/"+QUESTIONS.length+(persistent?"":" · nur Sitzung");
  controls.forEach(button=>button.disabled=state!=="running");
  $("main").textContent=state==="running"?"Pause":state==="paused"||state==="feedback"?"Weiter":"Start";
  let title="",detail="";
  if(state==="ready"){
    title="Bereit? Mit Start geht’s los.";
    detail="Münze +1 und Wachstum. Jede 9. Münze startet eine Frage.";
  }else if(state==="over"){
    title=endText;
    detail="Starte erneut. Dein Lernfortschritt bleibt erhalten.";
  }else if(state==="feedback"){
    title=result.correct?"Richtig! +10 Punkte und Wachstum.":"Falsch. Richtig: "+result.question.correct;
    detail=result.question.explanation;
  }else if(active){
    title=(state==="paused"?"Pause · ":"")+active.question.question;
    detail=state==="paused"?"Mit Weiter fortsetzen.":"Friss das richtige Antwortfeld · langsames Tempo.";
  }else{
    title=state==="paused"?"Pause":"Noch "+(9-count)+" Münze"+(9-count===1?"":"n")+" bis zur Frage.";
    detail=state==="paused"?"Mit Weiter fortsetzen.":"Wand und Körper meiden · richtige Antwort +10 und Wachstum.";
  }
  $("title").textContent=title;
  $("detail").textContent=detail;
}
function makeCoin(){
  const empty=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(!snake.some(p=>p.x===x&&p.y===y))empty.push({x,y});
  }
  if(!empty.length){finish("Geschafft! Das ganze Feld ist gefüllt.");return}
  coin=empty[Math.floor(Math.random()*empty.length)];
}
function reset(start=false){
  snake=[{x:5,y:7},{x:4,y:7},{x:3,y:7}];
  direction=vectors.right;
  turns=[];
  coin=null;
  points=0;
  count=0;
  active=null;
  result=null;
  endText="";
  accumulator=0;
  queue=QUESTIONS.filter(q=>!learned.has(q.id)).concat(QUESTIONS.filter(q=>learned.has(q.id)));
  state=start?"running":"ready";
  fields.forEach(el=>el.hidden=true);
  makeCoin();
  hud();
  draw();
}
function inside(point,rect){
  return point.x>=rect.x&&point.x<rect.x+rect.w&&point.y>=rect.y&&point.y<rect.y+rect.h;
}
function placeFields(){
  if(!active)return;
  const h=Math.min(7,Math.max(3,Math.ceil(64/(height/ROWS))));
  const head=snake[0];
  let bestY=0,bestScore=Infinity;
  for(let y=0;y<=ROWS-h;y++){
    const rects=[{x:0,y,w:9,h},{x:11,y,w:9,h}];
    if(rects.some(rect=>inside(head,rect)))continue;
    let overlaps=0;
    for(const p of snake)if(rects.some(rect=>inside(p,rect)))overlaps++;
    const distance=head.y<y?y-head.y:head.y>=y+h?head.y-(y+h-1):0;
    const score=overlaps*100-distance;
    if(score<bestScore){bestScore=score;bestY=y}
  }
  active.rects=[{x:0,y:bestY,w:9,h},{x:11,y:bestY,w:9,h}];
  fields.forEach((el,i)=>{
    const rect=active.rects[i];
    el.textContent=active.options[i].text;
    el.style.left=(rect.x/COLS*100)+"%";
    el.style.top=(rect.y/ROWS*100)+"%";
    el.style.width=(rect.w/COLS*100)+"%";
    el.style.height=(rect.h/ROWS*100)+"%";
    el.hidden=false;
  });
}
function ask(){
  const question=queue.shift();
  const options=[{text:question.correct,correct:true},{text:question.wrong,correct:false}];
  if(Math.random()<.5)options.reverse();
  active={question,options,rects:[]};
  coin=null;
  turns=[];
  accumulator=0;
  hud();
  resize();
}
function answer(index){
  const question=active.question,correct=active.options[index].correct;
  if(correct){
    points+=10;
    learned.add(question.id);
  }
  queue.push(question);
  result={question,correct};
  active=null;
  state="feedback";
  turns=[];
  accumulator=0;
  fields.forEach(el=>el.hidden=true);
  save();
  hud();
}
function finish(text){
  state="over";
  endText=text;
  accumulator=0;
  turns=[];
  active=null;
  fields.forEach(el=>el.hidden=true);
  save();
  hud();
}
function step(){
  if(state!=="running")return;
  if(turns.length)direction=turns.shift();
  const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
  const takesCoin=coin&&head.x===coin.x&&head.y===coin.y;
  const answerIndex=active?active.rects.findIndex(rect=>inside(head,rect)):-1;
  const grows=!!takesCoin||(answerIndex>=0&&active.options[answerIndex].correct);
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){
    finish("Spielende · Wand berührt.");return;
  }
  const bodyLength=snake.length-(grows?0:1);
  for(let i=0;i<bodyLength;i++){
    if(snake[i].x===head.x&&snake[i].y===head.y){
      finish("Spielende · eigenen Körper berührt.");return;
    }
  }
  snake.unshift(head);
  if(!grows)snake.pop();
  if(answerIndex>=0){answer(answerIndex);return}
  if(takesCoin){
    points++;
    count++;
    save();
    if(count===9)ask();
    else{makeCoin();hud()}
  }
}
function steer(name){
  if(state!=="running"||turns.length>=2)return;
  const next=vectors[name],previous=turns.length?turns[turns.length-1]:direction;
  if(next.x===previous.x&&next.y===previous.y)return;
  if(next.x===-previous.x&&next.y===-previous.y)return;
  turns.push(next);
}
function mainAction(){
  if(state==="ready"||state==="over"){reset(true);return}
  if(state==="running"){state="paused";accumulator=0}
  else if(state==="paused"){state="running";accumulator=0}
  else if(state==="feedback"){
    state="running";
    count=0;
    result=null;
    turns=[];
    accumulator=0;
    makeCoin();
  }
  hud();
  draw();
}
$("main").addEventListener("click",mainAction);
$("restart").addEventListener("click",()=>reset(true));
controls.forEach(button=>{
  button.addEventListener("pointerdown",event=>{
    event.preventDefault();
    steer(button.dataset.dir);
  });
  button.addEventListener("click",event=>{
    if(event.detail===0)steer(button.dataset.dir);
  });
});
const keyMap={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"};
document.addEventListener("keydown",event=>{
  const key=event.key.length===1?event.key.toLowerCase():event.key;
  if(keyMap[key]){
    event.preventDefault();
    if(!event.repeat)steer(keyMap[key]);
  }
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&state==="running"){
    state="paused";
    accumulator=0;
    hud();
  }
});
function resize(){
  const rect=board.getBoundingClientRect();
  width=Math.max(1,board.clientWidth);
  height=Math.max(1,board.clientHeight);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(width*dpr);
  canvas.height=Math.round(height*dpr);
  ctx.setTransform(canvas.width/width,0,0,canvas.height/height,0,0);
  placeFields();
  draw();
}
function draw(){
  const cw=width/COLS,ch=height/ROWS;
  ctx.fillStyle="#122c23";
  ctx.fillRect(0,0,width,height);
  ctx.strokeStyle="#1c3b2f";
  ctx.lineWidth=.6;
  ctx.beginPath();
  for(let x=1;x<COLS;x++){ctx.moveTo(x*cw,0);ctx.lineTo(x*cw,height)}
  for(let y=1;y<ROWS;y++){ctx.moveTo(0,y*ch);ctx.lineTo(width,y*ch)}
  ctx.stroke();
  if(coin){
    const x=(coin.x+.5)*cw,y=(coin.y+.5)*ch,r=Math.min(cw,ch)*.36;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle="#ffd15a";
    ctx.fill();
    ctx.fillStyle="#775118";
    ctx.fillRect(x-r*.15,y-r*.55,Math.max(1,r*.3),r*1.1);
  }
  const gap=Math.max(1,Math.min(cw,ch)*.09);
  for(let i=snake.length-1;i>=0;i--){
    const p=snake[i];
    ctx.fillStyle=i===0?"#c7f9b4":"#65bf85";
    ctx.fillRect(p.x*cw+gap,p.y*ch+gap,cw-gap*2,ch-gap*2);
  }
  if(snake.length){
    const head=snake[0],cx=(head.x+.5)*cw,cy=(head.y+.5)*ch;
    const dot=Math.max(1.2,Math.min(cw,ch)*.09);
    ctx.fillStyle="#153827";
    for(const side of [-1,1]){
      const x=cx+direction.x*cw*.22+(direction.y?side*cw*.19:0);
      const y=cy+direction.y*ch*.22+(direction.x?side*ch*.19:0);
      ctx.beginPath();ctx.arc(x,y,dot,0,Math.PI*2);ctx.fill();
    }
  }
}
function frame(time){
  const delta=lastTime?Math.min(100,time-lastTime):0;
  lastTime=time;
  if(state==="running"){
    accumulator+=delta;
    let interval=active?420:165;
    while(state==="running"&&accumulator>=interval){
      accumulator-=interval;
      step();
      interval=active?420:165;
    }
  }else accumulator=0;
  draw();
  requestAnimationFrame(frame);
}
reset();
resize();
new ResizeObserver(resize).observe(board);
window.addEventListener("resize",resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
